# =====================================================================
#  ERP_CRM_FACTORY (Odoo) - VARIABLES
#  >>> SEUL FICHIER A MODIFIER POUR CHAQUE NOUVEAU DEPLOIEMENT <<<
#  Meme regle d'or que WAZ_ELK_FACTORY : aucune valeur en dur dans les
#  jobs, tout vient d'ici. Meme moteur d'orchestration (orchestrator.sh,
#  forcer_job.sh, jobs_table.csv) que le projet WEF - reutilise tel quel,
#  jamais reecrit pour ce projet.
# =====================================================================
set -uo pipefail 2>/dev/null || true

# ---------------------------------------------------------------------
# IDENTITE
# ---------------------------------------------------------------------
PROJECT_NAME="ERP_CRM_FACTORY"
ROLE="ODOO_HOST"
FACTORY_HOST_IP="192.168.50.130"

# ---------------------------------------------------------------------
# REPERTOIRES (identiques dans l'esprit a WAZ_ELK_FACTORY)
# ---------------------------------------------------------------------
INSTALL_DIR="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)"
STATE_DIR="${INSTALL_DIR}/state"
LOG_DIR="${INSTALL_DIR}/logs"
WORK_TMP_DIR="${STATE_DIR}/tmp"
HISTORY_DIR="${STATE_DIR}/history"

# ---------------------------------------------------------------------
# DIMENSIONNEMENT RESSOURCES - verifie reellement le 2026-09-01 sur la
# VM cible (wef-beats-sensor, reutilisee pour ce projet) : 1 vCPU,
# 5,6 Go RAM, disque etendu a 60 Go (56 Go utiles apres croissance
# reelle du filesystem le meme jour). Seuil bas assume : Odoo + PostgreSQL
# sur 1 seul worker, pas de charge concurrente reelle attendue pour une
# demo. A remonter avant un usage de production reel.
# ---------------------------------------------------------------------
MIN_VCPU_REQUIRED=1
MIN_RAM_GB_REQUIRED=4
MIN_DISK_GB_REQUIRED=20

# ---------------------------------------------------------------------
# DNS INTERNE (meme principe que DNS_002_ZONE.sh cote WEF) - URL propre
# pour la demo plutot qu'une IP nue.
# ---------------------------------------------------------------------
DNS_DOMAIN="odoo.local"
ERP_DASHBOARD_FQDN="erp.${DNS_DOMAIN}"

# ---------------------------------------------------------------------
# POSTGRESQL (base de donnees d'Odoo - fait partie de son ecosysteme
# immediat, jamais suppose deja present)
# ---------------------------------------------------------------------
PG_VERSION="16"
PG_PORT=5432
PG_ODOO_DB_USER="odoo"
PG_ODOO_DB_NAME="odoo_demo"
PG_ODOO_DB_PASSWORD_FILE="${INSTALL_DIR}/secrets/pg_odoo_password.txt"

# ---------------------------------------------------------------------
# ODOO
# ---------------------------------------------------------------------
ODOO_VERSION="19.0"
ODOO_PORT=8069
ODOO_LONGPOLLING_PORT=8072
ODOO_USER="odoo"
ODOO_HOME="/opt/odoo"
ODOO_ADMIN_PASSWORD_FILE="${INSTALL_DIR}/secrets/odoo_admin_master_password.txt"
ODOO_CONF="/etc/odoo/odoo.conf"
ODOO_WORKERS=0
# ODOO_WORKERS=0 -> mode dev/mono-thread, adapte au seul vCPU disponible
# aujourd'hui (voir MIN_VCPU_REQUIRED ci-dessus) - a remonter (2*vCPU+1
# selon la doc officielle Odoo) des que la VM recoit plus de coeurs.

# ---------------------------------------------------------------------
# RELAIS SMTP SORTANT (ce qui "orbite" autour d'Odoo : devis/factures
# par e-mail, notifications). Postfix en mode relais local simple pour
# la demo - jamais un vrai serveur de production tant que ce n'est pas
# demande explicitement.
# ---------------------------------------------------------------------
SMTP_RELAY_MODE="local_catchall"
SMTP_RELAY_PORT=25

# ---------------------------------------------------------------------
# TLS - CORRIGE LE 2026-09-01 : ce projet est volontairement AUTONOME,
# aucune dependance fonctionnelle a WAZ_ELK_FACTORY ni a sa PKI d'usine
# (meme si les deux projets tournent aujourd'hui sur des VM voisines,
# .128 et .130). ODOO_015_NGINX_REVERSE_PROXY.sh genere son propre
# certificat auto-signe localement - jamais de lecture d'un repertoire
# PKI partage avec un autre projet. Une reference PKI_DIR/CRYPTO_GROUP
# figurait ici par erreur (copie depuis vars.conf de WEF, jamais
# utilisee par aucun job) - retiree pour ne pas laisser croire a une
# dependance qui n'existe pas.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# RETENTION DE L'HISTORIQUE PAR JOB (SYSOUT) - meme mecanisme que WEF
# ---------------------------------------------------------------------
HISTORY_RETENTION_DAYS=14

# ---------------------------------------------------------------------
# SAUVEGARDE
# ---------------------------------------------------------------------
BACKUP_DIR="/var/backups/odoo"
BACKUP_RETENTION_DAYS=7

# ---------------------------------------------------------------------
# ALERTE PAR EMAIL SUR ECHEC DE JOB (optionnel, meme mecanisme que WEF)
# ---------------------------------------------------------------------
NOTIF_ENABLED="non"
SMTP_HOST=""
SMTP_USER=""
SMTP_PASS_FILE="${INSTALL_DIR}/secrets/smtp_password.txt"
NOTIF_FROM=""
NOTIF_TO=""

# ---------------------------------------------------------------------
# SAUT VOLONTAIRE DE JOBS (meme mecanisme que WEF)
# ---------------------------------------------------------------------
SKIP_JOBS=""

# ---------------------------------------------------------------------
# TABLEAU DE BORD VISUEL (meme mecanisme que WEF)
# ---------------------------------------------------------------------
DASHBOARD_PORT=8088
