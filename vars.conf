# =====================================================================
#  ERP_CRM_FACTORY (Odoo) - VARIABLES
#  >>> SEUL FICHIER A MODIFIER POUR CHAQUE NOUVEAU DEPLOIEMENT <<<
#  Meme regle d'or que WAZ_ELK_FACTORY : aucune valeur en dur dans les
#  jobs, tout vient d'ici. Meme moteur d'orchestration (orchestrator.sh,
#  forcer_job.sh, jobs_table.csv) que le projet WEF - reutilise tel quel,
#  jamais reecrit pour ce projet.
# =====================================================================
set -uo pipefail 2>/dev/null || true

# ---------------------------------------------------------------------
# IDENTITE
# ---------------------------------------------------------------------
PROJECT_NAME="ERP_CRM_FACTORY"
ROLE="ODOO_HOST"
FACTORY_HOST_IP="192.168.50.130"

# ---------------------------------------------------------------------
# REPERTOIRES (identiques dans l'esprit a WAZ_ELK_FACTORY)
# ---------------------------------------------------------------------
INSTALL_DIR="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)"
STATE_DIR="${INSTALL_DIR}/state"
LOG_DIR="${INSTALL_DIR}/logs"
WORK_TMP_DIR="${STATE_DIR}/tmp"
HISTORY_DIR="${STATE_DIR}/history"

# ---------------------------------------------------------------------
# DIMENSIONNEMENT RESSOURCES - verifie reellement le 2026-09-01 sur la
# VM cible (wef-beats-sensor, reutilisee pour ce projet) : 1 vCPU,
# 5,6 Go RAM, disque etendu a 60 Go (56 Go utiles apres croissance
# reelle du filesystem le meme jour). Seuil bas assume : Odoo + PostgreSQL
# sur 1 seul worker, pas de charge concurrente reelle attendue pour une
# demo. A remonter avant un usage de production reel.
# ---------------------------------------------------------------------
MIN_VCPU_REQUIRED=1
MIN_RAM_GB_REQUIRED=4
MIN_DISK_GB_REQUIRED=20

# ---------------------------------------------------------------------
# DNS INTERNE (meme principe que DNS_002_ZONE.sh cote WEF) - URL propre
# pour la demo plutot qu'une IP nue.
# ---------------------------------------------------------------------
DNS_DOMAIN="odoo.local"
ERP_DASHBOARD_FQDN="erp.${DNS_DOMAIN}"

# ---------------------------------------------------------------------
# POSTGRESQL (base de donnees d'Odoo - fait partie de son ecosysteme
# immediat, jamais suppose deja present)
# ---------------------------------------------------------------------
PG_VERSION="16"
PG_PORT=5432
PG_ODOO_DB_USER="odoo"
PG_ODOO_DB_NAME="odoo_demo"
PG_ODOO_DB_PASSWORD_FILE="${INSTALL_DIR}/secrets/pg_odoo_password.txt"

# ---------------------------------------------------------------------
# ODOO
# ---------------------------------------------------------------------
ODOO_VERSION="19.0"
ODOO_PORT=8069
ODOO_LONGPOLLING_PORT=8072
ODOO_USER="odoo"
ODOO_HOME="/opt/odoo"
ODOO_ADMIN_PASSWORD_FILE="${INSTALL_DIR}/secrets/odoo_admin_master_password.txt"
ODOO_CONF="/etc/odoo/odoo.conf"
ODOO_WORKERS=0
# Espace central d'echange fichiers (rcv/snd/tmp/arc par module, voir
# jobs/ECFBOPD.sh) - AJOUTE ICI LE 2026-09-05 (etait recalcule a
# l'identique dans 29 jobs differents, jamais nomme comme une variable
# reelle du projet - source unique desormais, comme ODOO_HOME/STATE_DIR
# juste au-dessus/en-dessous). Sourcable directement par un operateur
# (source vars.conf) pour taper des commandes manuelles qui restent
# valables meme si ODOO_HOME change de valeur un jour.
OPERATIONS_DIR="${ODOO_HOME}/operations"
# Roles des 4 sous-dossiers de l'espace d'echange, identiques pour
# chaque module sous ${OPERATIONS_DIR}/<module>/<role> (voir
# jobs/ECFBOPD.sh) - AJOUTE ICI LE 2026-09-05 (meme correction que
# OPERATIONS_DIR juste au-dessus : les litteraux "rcv"/"snd"/"arc"
# etaient recopies a l'identique dans 27 jobs differents - RCV_DIR/
# SND_DIR/ARC_DIR restent des variables LOCALES a chaque job, elles
# combinent juste ces roles avec le module concerne). Noms alignes sur
# le vocabulaire deja utilise dans le dossier d'exploitation (colonnes
# "Dossier RECU"/"Dossier PRODUIT"/"Dossier ARCHIVE" de la feuille
# "Espace central d'echange") - appeler la variable donne deja le role.
DOSSIER_RECU="rcv"       # fichiers RECUS par ECF, a traiter (entree)
DOSSIER_PRODUIT="snd"    # fichiers PRODUITS par les traitements, a exporter (sortie)
DOSSIER_TRANSIT="tmp"    # transit technique - ecriture atomique avant DOSSIER_PRODUIT, jamais lu directement par un autre job
DOSSIER_ARCHIVE="arc"    # archive LOCALE au module, avant purge vers l'archive a froide
# Destination finale, cross-module, apres purge (voir jobs/ECFCPRG1.sh)
# - etait recalculee a l'identique dans ce seul job, meme principe.
ARCHIVE_FROIDE_DIR="${ODOO_HOME}/operations_archive_froide"
# ODOO_WORKERS=0 -> mode dev/mono-thread, adapte au seul vCPU disponible
# aujourd'hui (voir MIN_VCPU_REQUIRED ci-dessus) - a remonter (2*vCPU+1
# selon la doc officielle Odoo) des que la VM recoit plus de coeurs.

# ---------------------------------------------------------------------
# RELAIS SMTP SORTANT (ce qui "orbite" autour d'Odoo : devis/factures
# par e-mail, notifications). Postfix en mode relais local simple pour
# la demo - jamais un vrai serveur de production tant que ce n'est pas
# demande explicitement.
# ---------------------------------------------------------------------
SMTP_RELAY_MODE="local_catchall"
SMTP_RELAY_PORT=25

# ---------------------------------------------------------------------
# TLS - CORRIGE LE 2026-09-01 : ce projet est volontairement AUTONOME,
# aucune dependance fonctionnelle a WAZ_ELK_FACTORY ni a sa PKI d'usine
# (meme si les deux projets tournent aujourd'hui sur des VM voisines,
# .128 et .130). ODOO_015_NGINX_REVERSE_PROXY.sh genere son propre
# certificat auto-signe localement - jamais de lecture d'un repertoire
# PKI partage avec un autre projet. Une reference PKI_DIR/CRYPTO_GROUP
# figurait ici par erreur (copie depuis vars.conf de WEF, jamais
# utilisee par aucun job) - retiree pour ne pas laisser croire a une
# dependance qui n'existe pas.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# PARALLELISME DE L'ORCHESTRATEUR (ajoute le 2026-09-04, demande
# explicite utilisateur - capture d'ecran Control-M reelle montrant
# plusieurs chaines de jobs actives simultanement)
# ---------------------------------------------------------------------
# orchestrator.sh lance desormais TOUS les jobs prets d'une meme passe
# en parallele (plus jamais un par un comme avant, ni comme WEF) -
# MAX_PARALLEL_JOBS plafonne le nombre de jobs simultanes AU SEIN d'une
# meme passe, pour qu'une VM de demo ne se retrouve pas avec les 34
# modules (ou plus) lances a l'identique. Augmenter sur une machine
# plus puissante, reduire si la VM sature (CPU/RAM) pendant un
# deploiement complet.
MAX_PARALLEL_JOBS=6

# ---------------------------------------------------------------------
# RETENTION DE L'HISTORIQUE PAR JOB (SYSOUT) - meme mecanisme que WEF
# ---------------------------------------------------------------------
HISTORY_RETENTION_DAYS=14

# ---------------------------------------------------------------------
# SAUVEGARDE
# ---------------------------------------------------------------------
BACKUP_DIR="/var/backups/odoo"
BACKUP_RETENTION_DAYS=7

# ---------------------------------------------------------------------
# ALERTE PAR EMAIL SUR ECHEC DE JOB (meme mecanisme que WEF)
# ---------------------------------------------------------------------
# ACTIVE le 2026-09-01, demande explicite du client (alertes reelles
# attendues dans Outlook, dossier "ERP_CRM_FACTORY" trie sur l'objet -
# notifier.sh utilise "[${PROJECT_NAME}]", jamais code en dur - corrige
# le meme jour, voir docs/JOURNAL_TECHNIQUE.md, il affichait par erreur
# "[WAZ_ELK_FACTORY]" copie depuis WEF). Reglages NON SECRETS uniquement
# ici - le mot de passe reste hors de Git (voir SMTP_PASS_FILE) : deposez-
# le vous-meme sur chaque machine de destination, CHEMIN ABSOLU (jamais
# relatif - on ne sait jamais depuis quel repertoire l'operateur tape la
# commande ; destination documentee dans README.md : ~/erp_crm_factory) :
#   echo -n 'mot_de_passe' > ~/erp_crm_factory/secrets/smtp_password.txt
#   chmod 600 ~/erp_crm_factory/secrets/smtp_password.txt
NOTIF_ENABLED="oui"
SMTP_HOST="smtp.mail.ovh.net"
SMTP_PORT=465
SMTP_USER="contact@ankrr.fr"
SMTP_PASS_FILE="${INSTALL_DIR}/secrets/smtp_password.txt"
NOTIF_FROM="contact@ankrr.fr"
NOTIF_TO="contact@ankrr.fr"

# ---------------------------------------------------------------------
# ALERTE PAR EMAIL SUR EVENEMENT METIER (bin/notifier_metier.sh, AJOUTE
# LE 2026-09-05, demande explicite utilisateur) - DIFFERENT du bloc
# ci-dessus : NOTIF_ENABLED/NOTIF_TO alertent l'EXPLOITANT IT sur un
# ECHEC DE JOB (evenement systeme - le traitement n'a pas tourne).
# NOTIF_METIER_ENABLED/NOTIF_METIER_TO alertent un DESTINATAIRE METIER
# (RH, commercial, atelier...) quand un traitement a bien tourne ET
# produit un resultat qui merite un regard humain (ex. des contrats
# arrivent a echeance, des paniers sont a relancer) - le job decide
# lui-meme du critere (typiquement "COUNT > 0"), jamais un envoi
# systematique a chaque execution. Meme compte SMTP (SMTP_HOST/PORT/
# USER/PASS_FILE ci-dessus, une seule boite mail suffit), toggle et
# destinataire separes pour pouvoir activer l'un sans l'autre.
NOTIF_METIER_ENABLED="oui"
NOTIF_METIER_TO="contact@ankrr.fr"

# ---------------------------------------------------------------------
# SAUT VOLONTAIRE DE JOBS (meme mecanisme que WEF)
# ---------------------------------------------------------------------
# ECFBOSU (ECF_SYS_BLD_OSUPDATE) deja gele (HELD) en reel sur la VM (voir
# ./geler_job.sh, 2026-09-01) - renforce ici au niveau du depot pour que
# la decision survive independamment de l'etat/disponibilite de cette VM
# precise (meme raisonnement que le renforcement fait sur WEF/ES_001 le
# meme jour, demande explicite du client).
# CORRIGE LE 2026-09-04 : cette ligne referencait encore "ODOO_001_OS_UPDATE",
# le JOB_ID d'avant la refonte complete du schema de nommage (voir
# docs/CONVENTION_NOMMAGE.md) - plus aucun job de jobs_table.csv ne
# porte ce nom depuis, donc SKIP_JOBS ne sautait plus rien du tout,
# silencieusement, depuis la refonte. Trouve en relisant vars.conf pour
# ajouter MAX_PARALLEL_JOBS ci-dessous, corrige au meme endroit.
SKIP_JOBS="ECFBOSU"

# ---------------------------------------------------------------------
# TABLEAU DE BORD VISUEL (meme mecanisme que WEF)
# ---------------------------------------------------------------------
DASHBOARD_PORT=8088
